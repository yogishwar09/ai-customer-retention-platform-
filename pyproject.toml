[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retentioniq"
version = "3.0.0"
description = "Customer retention decision intelligence: explainable churn risk, policy-based next-best actions, monitoring and governance."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.1",
    "scikit-learn==1.5.2",
    "xgboost==2.1.1",
    "shap==0.46.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "SQLAlchemy>=2.0,<2.1",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
app = ["streamlit>=1.38,<2", "plotly>=5.22"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages and Markdown report templates contain long HTML/f-string literals.
"app_pages/*" = ["E501"]
"app.py" = ["E501"]
"src/retentioniq/reporting.py" = ["E501"]
"src/retentioniq/storage/repository.py" = ["E501"]
"src/retentioniq/assistant/semantic.py" = ["E501"]
"tests/*" = ["E501"]
